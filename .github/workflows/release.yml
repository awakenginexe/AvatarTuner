name: Release

# Tag pushes (v1.0.0 style) validate, build both distribution formats and publish a
# GitHub Release, then update the public VPM repo listing on GitHub Pages.
# workflow_dispatch validates and builds WITHOUT publishing a release or touching the
# live VPM listing, so CI results can be reviewed before the first public release.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (x.y.z, must match package.json and CHANGELOG.md)'
        required: true
        type: string

env:
  PACKAGE_NAME: AvatarTuner
  PACKAGE_ID: com.avatartuner.tool
  LISTING_URL: https://awakenginexe.github.io/AvatarTuner/index.json

jobs:
  # ---------------------------------------------------------------- build & validate
  build:
    name: Validate and build packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve and validate the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v${{ inputs.version }}"
          fi

          # The tag wildcard is not a strict semver parser - validate explicitly.
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "error: tag '$TAG' is not a strict semantic version (expected v1.2.3)" >&2
            exit 1
          fi

          VERSION="${TAG#v}"
          PACKAGE_VERSION="$(python3 -c "import json; print(json.load(open('package.json'))['version'])")"
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "error: tag version '$VERSION' does not match package.json version '$PACKAGE_VERSION'" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      - name: Offline test suite (no Unity required)
        run: dotnet run --project "Tests/Standalone~/AvatarTuner.StandaloneTests.csproj"

      - name: Core netstandard2.1 compatibility build
        run: dotnet build "Tests/Standalone~/core-compat/AvatarTuner.Core.NetStandard.csproj"

      - name: Editor sources type-check against Unity 2022.3 API stubs
        run: dotnet build "Tools~/editor-api-check~/EditorApiCheck.csproj"

      - name: Extract release notes for this version
        run: python3 scripts/extract_release_notes.py --version "${{ steps.version.outputs.version }}" --out release-notes.md

      - name: Build and verify the .unitypackage
        run: python3 scripts/build_unitypackage.py --version "${{ steps.version.outputs.version }}" --out "dist/${PACKAGE_NAME}-v${{ steps.version.outputs.version }}.unitypackage"

      - name: Build and verify the VPM package (zip)
        run: python3 scripts/build_vpmpackage.py --version "${{ steps.version.outputs.version }}" --url "https://github.com/awakenginexe/AvatarTuner/releases/download/${{ steps.version.outputs.tag }}/${PACKAGE_ID}-${{ steps.version.outputs.version }}.zip" --out "dist/${PACKAGE_ID}-${{ steps.version.outputs.version }}.zip"

      - name: Verify release artifacts exist and are non-empty
        shell: bash
        run: |
          set -euo pipefail
          test -s "dist/${PACKAGE_NAME}-v${{ steps.version.outputs.version }}.unitypackage"
          test -s "dist/${PACKAGE_NAME}-v${{ steps.version.outputs.version }}.unitypackage.sha256"
          test -s "dist/${PACKAGE_ID}-${{ steps.version.outputs.version }}.zip"
          test -s "dist/${PACKAGE_ID}-${{ steps.version.outputs.version }}.zip.sha256"
          test -s release-notes.md

      - name: Upload build artifacts (no release is published)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: avatartuner-package
          path: |
            dist/*.unitypackage
            dist/*.unitypackage.sha256
            dist/*.zip
            dist/*.zip.sha256
            release-notes.md
          if-no-files-found: error

  # ---------------------------------------------------------------- publish (tag pushes only)
  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Refuse to republish an existing release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "${{ needs.build.outputs.tag }}" >/dev/null 2>&1; then
            echo "error: a release for tag '${{ needs.build.outputs.tag }}' already exists; refusing to republish" >&2
            exit 1
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: avatartuner-package

      - name: Create GitHub Release for the tag
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: AvatarTuner ${{ needs.build.outputs.tag }}
          body_path: release-notes.md
          files: |
            dist/*.unitypackage
            dist/*.unitypackage.sha256
            dist/*.zip
            dist/*.zip.sha256
          fail_on_unmatched_files: true

  # ---------------------------------------------------------------- VPM listing on Pages
  pages:
    name: Update VPM repository listing on GitHub Pages
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: avatartuner-package

      - name: Merge this version into the VPM listing (old versions are preserved)
        shell: bash
        run: |
          set -euo pipefail
          ZIP_SHA="$(cut -d' ' -f1 "dist/${PACKAGE_ID}-${{ needs.build.outputs.version }}.zip.sha256")"
          ZIP_URL="https://github.com/awakenginexe/AvatarTuner/releases/download/${{ needs.build.outputs.tag }}/${PACKAGE_ID}-${{ needs.build.outputs.version }}.zip"
          python3 scripts/update_vpm_listing.py \
            --version "${{ needs.build.outputs.version }}" \
            --zip-sha256 "$ZIP_SHA" \
            --zip-url "$ZIP_URL" \
            --existing "$LISTING_URL" \
            --out site/index.json

      - name: Validate the listing points at the published assets
        shell: bash
        run: |
          set -euo pipefail
          test -s site/index.json
          grep -q "\"zipSHA256\"" site/index.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

      - name: Deploy the VPM listing to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
